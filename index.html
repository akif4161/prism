<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
body{background:#050816;color:white;font-family:sans-serif}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.15);border-radius:20px}
.btn-main{background:linear-gradient(90deg,#00d4ff,#7b2ff7);padding:12px;border-radius:12px;font-weight:bold;width:100%}
input{background:#0b1026;border:1px solid #333;padding:12px;border-radius:12px;width:100%;outline:none;color:white}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div id="loginScreen" class="glass p-6 w-full max-w-md">
  <h1 class="text-4xl font-black text-center">PRISM<span class="text-cyan-400"> AI</span></h1>
  <p class="text-center text-gray-400 text-sm mt-1 mb-6">Geleceğin zekasına hoş geldin</p>
  <input id="email" type="email" placeholder="E-posta" class="mb-3">
  <input id="password" type="password" placeholder="Şifre (en az 6 karakter)" class="mb-4">
  <button onclick="loginEmail()" class="btn-main mb-3">Giriş Yap / Kayıt Ol</button>
  <button onclick="loginGuest()" class="w-full p-3 rounded-xl border border-white/20 bg-white/5">Misafir Olarak Devam Et</button>
  <p id="errorMsg" class="text-red-400 text-sm text-center mt-4"></p>
</div>

<div id="chatScreen" class="hidden w-full max-w-2xl">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-black">PRISM <span class="text-cyan-400">AI</span></h2>
    <button onclick="logout()" class="text-sm bg-red-500/20 text-red-300 px-3 py-1 rounded-lg">Çıkış Yap</button>
  </div>
  <div id="messages" class="glass p-4 h-[450px] overflow-y-auto mb-3 space-y-3">
    <div class="bg-cyan-500/20 p-3 rounded-xl">Selam! Ben PRISM. Sana nasıl yardımcı olayım? 💎</div>
  </div>
  <div class="flex gap-2">
    <input id="userInput" placeholder="Bir şey yaz..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()" class="bg-cyan-500 px-5 rounded-xl font-bold">Gönder</button>
  </div>
</div>

<script>
// ===== 1. GROQ ANAHTARINI BURAYA YAPIŞTIR =====
const GROQ_API_KEY = "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";

// ===== 2. FIREBASE AYARLARIN =====
const firebaseConfig = {
  apiKey: "AIzaSyDVl8A6j0mqFkP2OujjBuC8MTqBoJiMDz8",
  authDomain: "AIzaSyDVl8A6j0mqFkP2OujjBuC8MTqBoJiMDz8",
  projectId: "prismai-7933b",
  storageBucket: "prismai-7933b.firebasestorage.app",
  messagingSenderId: "818649887767",
  appId: "1:818649887767:web:233444f96483a52c331852",
  measurementId: "G-RJQSHHQSXK"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('chatScreen').classList.remove('hidden');
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('chatScreen').classList.add('hidden');
  }
});

async function loginEmail(){
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const err = document.getElementById('errorMsg');
  err.textContent = "";
  if(!email || !pass){ err.textContent = "E-posta ve şifre yaz kral"; return; }
  if(pass.length < 6){ err.textContent = "Şifre en az 6 karakter olmalı"; return; }
  try{ await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){
    if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential'){
      try{ await auth.createUserWithEmailAndPassword(email, pass); }
      catch(e2){ err.textContent = "Hata: " + e2.message; }
    } else { err.textContent = "Hata: " + e.message; }
  }
}
async function loginGuest(){
  try{ await auth.signInAnonymously(); }
  catch(e){ document.getElementById('errorMsg').textContent = "Firebase'de Anonim'i açman lazım: " + e.message; }
}
function logout(){ auth.signOut(); }

async function sendMsg(){
  const inp = document.getElementById('userInput');
  const txt = inp.value.trim();
  if(!txt) return;
  const box = document.getElementById('messages');
  box.innerHTML += `<div class="bg-white/10 p-3 rounded-xl text-right ml-10">${txt}</div>`;
  inp.value = "";
  const loadingId = "msg-" + Date.now();
  box.innerHTML += `<div id="${loadingId}" class="bg-cyan-500/20 p-3 rounded-xl mr-10">Yazıyor... 💎</div>`;
  box.scrollTop = box.scrollHeight;

  try{
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + GROQ_API_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "llama-3.3-70b-versatile",
        messages: [{role:"system", content:"Sen PRISM AI'sın, Türkçe konuş, samimi ve akıllı ol."},{role:"user", content: txt}]
      })
    });
    const data = await res.json();
    const cevap = data.choices?.[0]?.message?.content || "Cevap alamadım, anahtarı kontrol et kral.";
    document.getElementById(loadingId).textContent = cevap;
  }catch(e){
    document.getElementById(loadingId).textContent = "Hata oldu kral, Groq anahtarını kontrol et.";
  }
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
