<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM AI</title>
<style>
  body{background:#050508;color:white;font-family:Arial;text-align:center;padding:20px;margin:0}
  h1{font-size:42px;letter-spacing:5px;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .box{background:#111118;border:1px solid #2a2a3a;border-radius:20px;padding:20px;max-width:480px;margin:15px auto}
  input{width:90%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#1a1a24;color:white;outline:none}
  button{padding:12px 18px;border:none;border-radius:12px;margin:5px;font-weight:bold;cursor:pointer}
  .mor{background:#7c3aed;color:white}
  .mavi{background:#2563eb;color:white}
  .yesil{background:#16a34a;color:white}
  .kirmizi{background:#dc2626;color:white}
  #cevap{background:#1a1a24;padding:15px;border-radius:12px;min-height:60px;text-align:left;margin-top:10px}
  #durum{font-size:13px;color:#a78bfa}
</style>
</head>
<body>

<h1>PRISM AI</h1>
<p>Gelecek burada. İzleyen değil, yazan ol.</p>

<!-- GİRİŞ -->
<div class="box">
  <h3>🔐 Giriş</h3>
  <input id="email" placeholder="Email">
  <input id="sifre" type="password" placeholder="Şifre">
  <button class="mor" onclick="kayitOl()">Kayıt Ol</button>
  <button class="mavi" onclick="girisYap()">Giriş Yap</button>
  <p id="kullanici" style="font-size:13px;color:#aaa"></p>
</div>

<!-- SESLİ + LIVE -->
<div class="box">
  <h3>🎙️ Sesli Konuşma + Live Modu</h3>
  <p id="durum">Hazır, dinlemiyorum</p>
  <button class="yesil" onclick="dinle()">🎤 Konuş</button>
  <button class="mavi" onclick="liveBaslat()">🔴 Live Başlat</button>
  <button class="kirmizi" onclick="liveDurdur()">⏹️ Live Durdur</button>
  <button class="mor" onclick="konus('Selam kral, PRISM Live modundayım, seni dinliyorum')">🔊 Test Sesi</button>
  <div id="cevap">Burada ne dediğin ve PRISM'in cevabı çıkacak...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // BURAYI KENDİ BİLGİLERİNLE DEĞİŞTİR
  const SUPABASE_URL = "BURAYA_PROJECT_URL";
  const SUPABASE_KEY = "BURAYA_ANON_KEY";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function kayitOl(){
    const email = document.getElementById('email').value;
    const password = document.getElementById('sifre').value;
    const { error } = await supabase.auth.signUp({ email, password });
    if(error) alert(error.message); else alert('Kayıt oldu, mailini kontrol et!');
  }
  async function girisYap(){
    const email = document.getElementById('email').value;
    const password = document.getElementById('sifre').value;
    const { error, data } = await supabase.auth.signInWithPassword({ email, password });
    if(error) alert(error.message);
    else { document.getElementById('kullanici').innerText = 'Hoşgeldin: ' + data.user.email; alert('Giriş başarılı 💎'); }
  }

  // SESLİ KONUŞMA
  let recognition;
  let liveAcik = false;

  function konus(metin){
    const ses = new SpeechSynthesisUtterance(metin);
    ses.lang = 'tr-TR';
    ses.rate = 1;
    window.speechSynthesis.speak(ses);
  }

  function cevapUret(sordu){
    sordu = sordu.toLowerCase();
    let cevap = "Anladım kral, " + sordu + " hakkında düşünüyorum, çok iyi bir fikir.";
    if(sordu.includes('selam') || sordu.includes('merhaba')) cevap = "Selam kral! PRISM burada, seni dinliyorum.";
    if(sordu.includes('nasılsın')) cevap = "Çok iyiyim, seninle konuşunca daha da iyi oldum.";
    if(sordu.includes('prism')) cevap = "PRISM benim, geleceği yazmak için buradayım. İzleyen değil, yazan ol.";
    if(sordu.includes('kimsin')) cevap = "Ben PRISM AI, senin yapay zeka dostunum.";
    if(sordu.includes('şaka')) cevap = "Sana bir şaka yapayım, yapay zeka niye denize girmemiş? Çünkü verileri ıslanırmış.";
    document.getElementById('cevap').innerHTML = "<b>Sen:</b> " + sordu + "<br><br><b>PRISM:</b> " + cevap;
    konus(cevap);
  }

  function dinle(){
    if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
      alert('Telefonun bu tarayıcıda ses tanımayı desteklemiyor. Chrome kullan kral.');
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'tr-TR';
    recognition.interimResults = false;
    document.getElementById('durum').innerText = '🎤 Dinliyorum... Konuş kral';
    recognition.start();
    recognition.onresult = (e) => {
      const metin = e.results[0][0].transcript;
      document.getElementById('durum').innerText = 'Duydum: ' + metin;
      cevapUret(metin);
    };
    recognition.onerror = () => { document.getElementById('durum').innerText = 'Bir hata oldu, tekrar dene'; }
  }

  function liveBaslat(){
    liveAcik = true;
    document.getElementById('durum').innerText = '🔴 LIVE AÇIK - Sürekli dinliyorum';
    konus('Live modu açıldı kral, seni dinliyorum');
    liveDongu();
  }
  function liveDurdur(){
    liveAcik = false;
    if(recognition) recognition.stop();
    document.getElementById('durum').innerText = 'Live kapatıldı';
    window.speechSynthesis.cancel();
  }
  function liveDongu(){
    if(!liveAcik) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'tr-TR';
    recognition.continuous = false;
    recognition.start();
    recognition.onresult = (e) => {
      const metin = e.results[0][0].transcript;
      cevapUret(metin);
      setTimeout(()=>{ if(liveAcik) liveDongu(); }, 1500);
    };
    recognition.onerror = () => { if(liveAcik) setTimeout(liveDongu, 1000); };
    recognition.onend = () => { if(liveAcik) setTimeout(liveDongu, 500); };
  }
</script>
</body>
</html>
